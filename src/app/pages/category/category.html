<div class="toolbar">
  <h2>Categorías</h2>
  <div class="actions">
    <button pButton label="Ordenar" icon="pi pi-sort-alt" severity="secondary" (click)="openReorder()"
      [disabled]="loading || list.length < 2"></button>
    <button pButton label="Nueva categoría" icon="pi pi-plus" (click)="open(null)" [disabled]="loading"></button>
    <button pButton label="Buscar" icon="pi pi-search" severity="secondary" (click)="read(true)"
      [disabled]="loading"></button>
  </div>
</div>

@if (loading) {
<div class="loading" role="status">
  <p-progress-spinner ariaLabel="Cargando categorías" />
  <p>Cargando...</p>
</div>
} @else {
<p-table [value]="list" dataKey="_id" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10,25,50]" [rowHover]="true"
  [scrollable]="true" size="small" [showCurrentPageReport]="true"
  currentPageReportTemplate="{first} a {last} de {totalRecords} categorías" [tableStyle]="{'min-width':'42rem'}">
  <ng-template pTemplate="header">
    <tr>
      <th>#</th>
      <th>Acciones</th>
      <th>Título</th>
      <th>Creado</th>
      <th>Actualizado</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-row>
    <tr>
      <td>{{ row.order }}</td>
      <td>
        <div class="actions">
          <p-button icon="pi pi-pencil" ariaLabel="Editar categoría" size="small" (onClick)="open(row)" />
          <p-button icon="pi pi-trash" ariaLabel="Eliminar categoría" size="small" severity="danger"
            (onClick)="remove(row)" />
        </div>
      </td>
      <td>{{ row.title }}</td>
      <td>{{ row.created_at | date:'dd/MM/yyyy HH:mm' }}</td>
      <td>{{ row.updated_at | date:'dd/MM/yyyy HH:mm' }}</td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5" class="empty">No hay categorías.</td>
    </tr>
  </ng-template>
</p-table>
}

<p-dialog [(visible)]="modal" [modal]="true" [header]="editing ? 'Editar categoría' : 'Nueva categoría'"
  [style]="{width:'450px'}" [closable]="!saving" [draggable]="false">
  <form [formGroup]="form" (ngSubmit)="save()" class="grid">
    <div class="col-12">
      <label for="category-title">Título <span class="text-red-500">*</span></label>
      <input id="category-title" pInputText formControlName="title" class="w-full mt-2" />
      <small *ngIf="form.controls.title.touched && form.controls.title.invalid" class="text-red-500">
        Ingresa un título.
      </small>
    </div>
    <div class="col-12">
      <button pButton type="submit" label="Guardar" icon="pi pi-save" class="w-full" [loading]="saving"
        [disabled]="saving || form.invalid">
      </button>
    </div>
  </form>
</p-dialog>

<p-dialog [(visible)]="modalReorder" header="Ordenar categorías" [modal]="true" [draggable]="false" [resizable]="false"
  [closable]="!savingOrder" [closeOnEscape]="!savingOrder" [style]="{width:'720px', maxWidth:'95vw'}" appendTo="body">
  <div class="actions" style="justify-content:flex-end;margin-bottom:12px;">
    <button pButton type="button" icon="pi pi-chevron-up" aria-label="Subir categoría"
      class="p-button-rounded p-button-text p-button-secondary" (click)="moveOrder(-1)"
      [disabled]="selectedIndex <= 0 || savingOrder"></button>
    <button pButton type="button" icon="pi pi-chevron-down" aria-label="Bajar categoría"
      class="p-button-rounded p-button-text p-button-secondary" (click)="moveOrder(1)"
      [disabled]="selectedIndex < 0 || selectedIndex >= reorderRows.length - 1 || savingOrder"></button>
    <button pButton type="button" label="Guardar orden" icon="pi pi-save" class="p-button-success p-button-sm"
      (click)="saveOrder()" [loading]="savingOrder" [disabled]="savingOrder || !reorderRows.length"></button>
  </div>
  <div class="border-1 border-round-xl surface-border surface-card overflow-hidden">
    <p-table [value]="reorderRows" selectionMode="single" [(selection)]="selectedReorderRow" dataKey="_id"
      [scrollable]="true" scrollHeight="420px" [rowHover]="true" styleClass="p-datatable-sm">
      <ng-template pTemplate="header">
        <tr>
          <th style="width:90px" class="text-center">#</th>
          <th>Categoría</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row let-i="rowIndex">
        <tr [pSelectableRow]="row" [pSelectableRowDisabled]="savingOrder" class="cursor-pointer"
          [class.bg-gray-900]="selectedReorderRow?._id === row._id">
          <td class="text-center"><span
              class="inline-flex border-1 surface-border border-round-lg px-2 py-1 text-sm">{{ i + 1 }}</span></td>
          <td class="font-semibold">{{ row.title }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</p-dialog>
